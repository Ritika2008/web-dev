<!DOCTYPE html>
<html>
<head>
  <title>Simple Hover Image</title>
  <style>
    img {
      width: 300px;
      filter: grayscale(100%);
    }

    img:hover {
      filter: none;
    }
  </style>
</head>
<body>

  <h3>Hover over the image:</h3>
  <img src="https://img.freepik.com/premium-photo/sand-road-green-field-tree_559599-14.jpg?w=740" alt="Image">

</body>
</html>
